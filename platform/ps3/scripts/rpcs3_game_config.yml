# RPCS3 per-game overrides for Blazium PS3 homebrew (dev_hdd0 launches).
# PPU Recompiler (LLVM) is required for practical boot times on large templates.
Core:
  PPU Decoder: Recompiler (LLVM)
  LLVM Precompilation: true
  Debug Console Mode: true
Miscellaneous:
  Show PPU compilation hint: false
Video:
  Write Color Buffers: true
