name: Sync master into 4.8

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List missing commits only; do not cherry-pick, push, or open a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-master-into-4.8
  cancel-in-progress: false

jobs:
  sync:
    name: Cherry-pick missing master commits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: blazium_4.8
      SOURCE_REMOTE: godot
      SOURCE_REPO: https://github.com/godotengine/godot.git
      SOURCE_BRANCH: master
      SYNC_BRANCH: ci/sync-master-into-4.8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch target and upstream Godot master
        run: |
          git fetch origin "${TARGET_BRANCH}"
          git remote add "${SOURCE_REMOTE}" "${SOURCE_REPO}" || git remote set-url "${SOURCE_REMOTE}" "${SOURCE_REPO}"
          git fetch "${SOURCE_REMOTE}" "${SOURCE_BRANCH}"

      - name: Cherry-pick missing commits and open or update PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          source_ref="${SOURCE_REMOTE}/${SOURCE_BRANCH}"
          target_ref="origin/${TARGET_BRANCH}"
          all_count="$(git rev-list --count "${target_ref}..${source_ref}")"
          mapfile -t missing < <(git log --reverse --no-merges --format=%H "${target_ref}..${source_ref}")
          if [ "${#missing[@]}" -eq 1 ] && [ -z "${missing[0]:-}" ]; then
            missing=()
          fi

          echo "GitHub compare (all commits, including merges): ${all_count}"
          echo "Cherry-pick set (--no-merges): ${#missing[@]}"

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "No commits on ${source_ref} are missing from ${target_ref}."
            exit 0
          fi

          echo "Missing non-merge commits:"
          git log --reverse --no-merges --oneline "${target_ref}..${source_ref}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: skipping cherry-pick, push, and PR."
            exit 0
          fi

          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"

          applied=0
          failed_sha=""
          for sha in "${missing[@]}"; do
            if git cherry-pick -x "${sha}"; then
              applied=$((applied + 1))
            else
              failed_sha="${sha}"
              git cherry-pick --abort
              break
            fi
          done

          if [ "${applied}" -eq 0 ]; then
            echo "Cherry-pick stopped on ${failed_sha}; nothing applied, skipping PR."
            exit 1
          fi

          git push --force-with-lease origin "${SYNC_BRANCH}"

          existing="$(gh pr list --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${existing}" ]; then
            gh pr create --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" \
              --title "chore: sync Godot master into blazium_4.8" \
              --body "$(cat <<EOF
          Daily cherry-pick of commits that are on \`godotengine/godot\` \`master\` but not yet on \`blazium_4.8\`.

          This is a standing PR: the next scheduled run resets the branch onto current \`blazium_4.8\` and reapplies still-missing commits.

          Source: \`godotengine/godot\` \`master\`
          Target: \`blazium_4.8\`
          Applied this run: ${applied}
          EOF
          )"
            existing="$(gh pr list --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          fi

          if [ -n "${failed_sha}" ]; then
            if [ -n "${existing}" ]; then
              gh pr comment "${existing}" --body "Cherry-pick stopped on \`${failed_sha}\` after ${applied} commit(s). Resolve conflicts or skip that commit and re-run the workflow."
            fi
            echo "Cherry-pick stopped on ${failed_sha} after ${applied} commit(s)."
            exit 1
          fi

          echo "Opened or updated PR #${existing} with ${applied} cherry-picked commit(s)."
