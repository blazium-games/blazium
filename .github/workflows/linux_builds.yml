name: 🐧 Linux Builds
on:
  workflow_call:
    inputs:
      changed-files:
        description: A list of changed files, pre-filtered for parsing by clangd-tidy.
        required: true
        type: string
  workflow_dispatch:

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  BLAZIUM_BASE_BRANCH: blazium_4.8
  SCONSFLAGS: verbose=yes warnings=extra werror=yes module_text_server_fb_enabled=yes strict_checks=yes
  BLAZIUM_CPP_BRANCH: blazium-dev
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt
  LSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/lsan.txt
  TSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/tsan.txt
  UBSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/ubsan.txt

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref_name }}-linux
  cancel-in-progress: true

jobs:
  build-linux:
    # Stay one LTS before latest to increase portability of Linux artifacts.
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor tests=yes)
            cache-name: linux-editor
            target: editor
            bin: ./bin/blazium.linuxbsd.editor.x86_64
            build-mono: false
            tests: true
            doc-test: true
            proj-conv: true
            api-compat: true
            artifact: true
            cache-limit: 1

          - name: Editor w/ Mono (target=editor)
            cache-name: linux-editor-mono
            target: editor
            sconsflags: module_mono_enabled=yes compiledb=yes
            bin: ./bin/blazium.linuxbsd.editor.x86_64.mono
            build-mono: true
            tests: false # Disabled due freeze caused by mix Mono build and CI
            doc-test: true
            proj-conv: true
            proj-export: true
            api-compat: true
            artifact: true
            # Validate blazium-cpp compatibility on one arbitrary editor build.
            blazium-cpp: true
            clangd-tidy: true
            cache-limit: 2

          - name: Editor with doubles and LLVM sanitizers (target=editor, tests=yes, dev_build=yes, precision=double, use_asan=yes, use_ubsan=yes, use_llvm=yes, linker=lld)
            cache-name: linux-editor-double-llvm-sanitizers
            target: editor
            # Debug symbols disabled as they're huge on this build and we hit the 14 GB limit for runners.
            # GCC+ASAN+double+tests cannot link: libtests R_X86_64_PC32 to shared libasan.so is out of range.
            # Clang sanitizers already link this tree; keep double precision on that toolchain.
            sconsflags: dev_build=yes debug_symbols=no precision=double use_asan=yes use_ubsan=yes use_llvm=yes linker=lld
            bin: ./bin/blazium.linuxbsd.editor.dev.double.x86_64.llvm.san
            build-mono: false
            tests: true
            proj-test: true
            # Skip 2GiB artifact speeding up action.
            artifact: false
            cache-limit: 7

          - name: Editor with clang sanitizers (target=editor, tests=yes, dev_build=yes, use_asan=yes, use_ubsan=yes, use_llvm=yes, linker=lld)
            cache-name: linux-editor-llvm-sanitizers
            target: editor
            sconsflags: dev_build=yes use_asan=yes use_ubsan=yes use_llvm=yes linker=lld
            bin: ./bin/blazium.linuxbsd.editor.dev.x86_64.llvm.san
            build-mono: false
            tests: true
            # Skip 2GiB artifact speeding up action.
            artifact: false
            # Test our oldest supported SCons/Python versions on one arbitrary editor build.
            legacy-scons: true
            cache-limit: 7

          - name: Editor with ThreadSanitizer (target=editor, tests=yes, dev_build=yes, use_tsan=yes, use_llvm=yes, linker=lld)
            cache-name: linux-editor-thread-sanitizer
            target: editor
            tests: true
            sconsflags: dev_build=yes use_tsan=yes use_llvm=yes linker=lld
            bin: ./bin/blazium.linuxbsd.editor.dev.x86_64.llvm.san
            build-mono: false
            # Skip 2GiB artifact speeding up action.
            artifact: false
            cache-limit: 5

          - name: Template w/ Mono, release (target=template_release, tests=yes)
            cache-name: linux-template-mono
            target: template_release
            sconsflags: module_mono_enabled=yes tests=yes
            bin: ./bin/blazium.linuxbsd.template_release.x86_64.mono
            build-mono: false
            tests: true
            artifact: true
            cache-limit: 1

          - name: Template w/ Mono, debug (target=template_debug, tests=yes)
            cache-name: linux-template-mono-debug
            target: template_debug
            sconsflags: module_mono_enabled=yes
            bin: ./bin/blazium.linuxbsd.template_debug.x86_64.mono
            build-mono: false
            tests: true
            artifact: true
            cache-limit: 1

          - name: Minimal template (target=template_release, tests=yes, everything disabled)
            cache-name: linux-template-minimal
            target: template_release
            sconsflags: modules_enabled_by_default=no disable_3d=yes disable_advanced_gui=yes deprecated=no minizip=no tests=yes
            bin: ./bin/blazium.linuxbsd.template_release.x86_64
            tests: true
            artifact: true
            cache-limit: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libwayland-bin  # TODO: Figure out somehow how to embed this one.
          if [ "${{ matrix.proj-test }}" == "true" -o "${{ matrix.proj-export }}" == "true" ]; then
            sudo apt-get install mesa-vulkan-drivers
          fi

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Restore Blazium build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: "!matrix.legacy-scons"
        uses: ./.github/actions/godot-deps

      - name: Setup Python and SCons (legacy versions)
        if: matrix.legacy-scons
        uses: ./.github/actions/godot-deps
        with:
          # Sync with Ensure*Version in SConstruct.
          python-version: 3.9
          scons-version: 4.4

      - name: Force remove preinstalled .NET SDKs
        if: matrix.build-mono
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup older .NET SDK as baseline
        if: matrix.build-mono
        uses: actions/setup-dotnet@v5
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.100

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lld linker
        if: matrix.proj-test
        run: |
          # Doubles+ASAN editor links with -fuse-ld=lld.
          sudo apt-get update
          sudo apt-get install -y lld
          ld.lld --version

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} ${{ matrix.sconsflags }}
          platform: linuxbsd
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}
          scons-cache-limit: ${{ matrix.cache-limit }}

      - name: Style checks via clangd-tidy
        if: matrix.clangd-tidy
        uses: ./.github/actions/clangd-tidy
        with:
          changed-files: ${{ inputs.changed-files }}

      - name: Compilation (blazium-cpp)
        uses: ./.github/actions/godot-cpp-build
        if: matrix.blazium-cpp
        with:
          bin: ${{ matrix.bin }}
          scons-flags: target=template_debug dev_build=yes verbose=yes
          godot-cpp-branch: ${{ env.BLAZIUM_CPP_BRANCH }}

      - name: Save Blazium build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET solutions
        if: matrix.build-mono
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --werror

      - name: Prepare artifact
        if: matrix.artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/blazium.*
          chmod +x bin/blazium.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: matrix.artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        if: matrix.tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --headless --test --force-colors

      - name: .NET source generators tests
        if: matrix.build-mono
        run: |
          dotnet test modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators.Tests

      # Check class reference
      - name: Check for class reference updates
        if: matrix.doc-test
        run: |
          echo "Running --doctool to see if this changes the public API without updating the documentation."
          echo -e "If a diff is shown, it means that your code/doc changes are incomplete and you should update the class reference with --doctool.\n\n"
          ${{ matrix.bin }} --doctool --headless 2>&1 > /dev/null || true
          git diff --color --exit-code && ! git ls-files --others --exclude-standard | sed -e 's/^/New doc file missing in PR: /' | grep 'xml$'

      # Check API backwards compatibility
      - name: Check for GDExtension compatibility – JSON check
        if: matrix.api-compat
        run: |
          ./misc/scripts/validate_extension_api.sh "${{ matrix.bin }}"

      - name: Test GDExtension compatibility – load methods
        uses: ./.github/actions/godot-compat-test
        if: matrix.api-compat
        with:
          bin: ${{ matrix.bin }}
          reftags: "4.5-stable,4.4-stable"

      # Download and run the test project
      - name: Test Blazium project
        uses: ./.github/actions/godot-project-test
        if: matrix.proj-test
        with:
          bin: ${{ matrix.bin }}

      # Test project export
      - name: Test project export
        uses: ./.github/actions/godot-project-export
        if: matrix.proj-export
        with:
          bin: ${{ matrix.bin }}

      # Test the project converter
      - name: Test project converter
        uses: ./.github/actions/godot-converter-test
        if: matrix.proj-conv
        with:
          bin: ${{ matrix.bin }}
