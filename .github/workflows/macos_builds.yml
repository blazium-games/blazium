name: 🍎 macOS Builds
on:
  workflow_call:

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  BLAZIUM_BASE_BRANCH: blazium-dev
  SCONSFLAGS: verbose=yes warnings=extra werror=yes module_text_server_fb_enabled=yes strict_checks=yes

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref_name }}-macos
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor, tests=yes)
            cache-name: macos-editor
            target: editor
            tests: true
            bin: ./bin/blazium.macos.editor.universal
            cache-limit: 1

          - name: Template (target=template_release, tests=yes)
            cache-name: macos-template
            target: template_release
            tests: true
            sconsflags: debug_symbols=no tests=yes
            bin: ./bin/blazium.macos.template_release.universal
            cache-limit: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.2
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify Xcode selection
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup Vulkan SDK
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_64
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}
          scons-cache-limit: 0 # Only cap on second run to avoid purging unnecessarily

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm64
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}
          scons-cache-limit: ${{ matrix.cache-limit }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          lipo -create ./bin/blazium.macos.${{ matrix.target }}.tests.x86_64 ./bin/blazium.macos.${{ matrix.target }}.tests.arm64 -output ./bin/blazium.macos.${{ matrix.target }}.universal
          rm ./bin/blazium.macos.${{ matrix.target }}.tests.x86_64 ./bin/blazium.macos.${{ matrix.target }}.tests.arm64
          strip bin/blazium.*
          chmod +x bin/blazium.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        if: matrix.tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors
