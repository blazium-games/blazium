name: Build godot-cpp
description: Build godot-cpp or blazium-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot/Blazium binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The C++ bindings branch.
    default: master
    type: string
  repository:
    description: The C++ bindings repository.
    default: godotengine/godot-cpp
    type: string
  checkout-path:
    description: Directory to check the C++ bindings out into.
    default: godot-cpp
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.godot-cpp-branch }}
        path: ${{ inputs.checkout-path }}

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    # godot-cpp ignores unknown command-line vars (ARCOM/LINKCOM). Patch the
    # checked-out SConstruct so SCons TEMPFILE is used; otherwise `ar`/`ld`
    # hit Linux ARG_MAX with Blazium's extra ClassDB types.
    - name: Avoid ARG_MAX when archiving godot-cpp
      shell: sh
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path("${{ inputs.checkout-path }}") / "SConstruct"
        text = p.read_text(encoding="utf-8")
        marker = 'Return("env")'
        insert = '''
def _blazium_tempfile(env, key, fallback):
    cmd = str(env.get(key, fallback))
    if "TEMPFILE" not in cmd:
        env[key] = "${TEMPFILE(%r)}" % cmd
_blazium_tempfile(env, "ARCOM", "$AR $ARFLAGS $TARGET $SOURCES")
_blazium_tempfile(env, "SHLINKCOM", "$SHLINK -o $TARGET $SHLINKFLAGS $SOURCES $_LIBDIRFLAGS $_LIBFLAGS")
_blazium_tempfile(env, "LINKCOM", "$LINK -o $TARGET $LINKFLAGS $SOURCES $_LIBDIRFLAGS $_LIBFLAGS")
Return("env")
'''
        if "def _blazium_tempfile" in text:
            print("already patched", p)
        elif marker not in text:
            raise SystemExit("Return(env) not found in %s" % p)
        else:
            p.write_text(text.replace(marker, insert, 1), encoding="utf-8")
            print("patched", p)
        PY

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./${{ inputs.checkout-path }}/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
