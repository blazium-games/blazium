name: Build godot-cpp
description: Build godot-cpp or blazium-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot/Blazium binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The C++ bindings branch.
    default: master
    type: string
  repository:
    description: The C++ bindings repository.
    default: godotengine/godot-cpp
    type: string
  checkout-path:
    description: Directory to check the C++ bindings out into.
    default: godot-cpp
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.godot-cpp-branch }}
        path: ${{ inputs.checkout-path }}

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./${{ inputs.checkout-path }}/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
