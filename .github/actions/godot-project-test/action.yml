name: Test Blazium project
description: Run the Blazium regression test project.

inputs:
  bin:
    description: The path to the Blazium executable
    required: true

runs:
  using: composite
  steps:
    # Download and extract zip archive with project, folder is renamed to be able to easy change used project
    - name: Download test project
      shell: sh
      run: |
        wget --retry-on-http-error=429,503 --tries=8 --waitretry=5 --timeout=60 -O regression-test-project.zip https://github.com/blazium-games/regression-test-project/archive/refs/tags/4.0.zip
        unzip regression-test-project.zip
        mv "regression-test-project-4.0" "test_project"

    # Editor is quite complicated piece of software, so it is easy to introduce bug here.

    - name: Open and close editor (Headless)
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} --headless --import --path test_project 2>&1 | tee sanitizers_log.txt || true
        misc/scripts/check_ci_log.py sanitizers_log.txt

    - name: Open and close editor (Vulkan)
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} --audio-driver Dummy --editor --quit --path test_project 2>&1 | tee sanitizers_log.txt || true
        misc/scripts/check_ci_log.py sanitizers_log.txt

    - name: Open and close editor (GLES3)
      shell: sh
      run: |
        DRI_PRIME=0 xvfb-run ${{ inputs.bin }} --audio-driver Dummy --rendering-driver opengl3 --editor --quit --path test_project 2>&1 | tee sanitizers_log.txt || true
        misc/scripts/check_ci_log.py sanitizers_log.txt

    # Run test project
    - name: Run project
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} 40 --audio-driver Dummy --path test_project 2>&1 | tee sanitizers_log.txt || true
        misc/scripts/check_ci_log.py sanitizers_log.txt
